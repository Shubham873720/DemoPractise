version: 2.1

# Define parameters that will be passed via the webhook
parameters:
  my_parameter:
    type: string
    default: "default_value"

executors:
  python-executor:
    docker:
      - image: circleci/python:3.9  # Use Python 3.9 image (or adjust based on your needs)
    working_directory: ~/repo

jobs:
  run-seating-script:
    executor: python-executor
    parameters:
      my_parameter:  # This links the parameter to the job
    steps:
      - checkout  # Check out the code from your repository
      - run:
          name: Install Dependencies
          command: |
            python -m venv venv  # Create a virtual environment
            . venv/bin/activate  # Activate the virtual environment

      - run:
          name: Run Python Script
          command: |
            . venv/bin/activate  # Activate the virtual environment
            # Pass the parameter to your Python script
            python sample.py << parameters.my_parameter >>

workflows:
  version: 2
  run-script-workflow:
    jobs:
      - run-seating-script:
          my_parameter: << pipeline.parameters.my_parameter >>  # Pass the parameter from the pipeline to the job
